<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极致之站</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans text-gray-800 bg-white scroll-smooth">

  <!-- Hero 首页 -->
  <section class="h-screen flex flex-col justify-center items-center bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-center px-6">
    <h1 class="text-5xl md:text-6xl font-bold mb-4">欢迎来到极致之站</h1>
    <p class="text-xl md:text-2xl mb-8">展示你的作品与价值，让世界认识你</p>
    <a href="#contact" class="bg-orange-500 hover:bg-orange-600 px-6 py-3 rounded-full text-lg font-semibold transition">立即联系</a>
  </section>

  <!-- 关于我 -->
  <section id="about" class="py-20 px-6 max-w-5xl mx-auto text-center">
    <h2 class="text-4xl font-bold mb-6">关于我</h2>
    <p class="text-lg mb-6">我是一名热爱创造的专业人士，擅长设计和开发高质量的网站与应用，专注用户体验和视觉美感。</p>
    <div class="flex flex-wrap justify-center gap-6">
      <div class="bg-gray-100 p-6 rounded-lg w-60">网页设计</div>
      <div class="bg-gray-100 p-6 rounded-lg w-60">前端开发</div>
      <div class="bg-gray-100 p-6 rounded-lg w-60">用户体验</div>
    </div>
  </section>

  <!-- 作品展示 -->
  <section id="portfolio" class="py-20 px-6 bg-gray-50">
    <h2 class="text-4xl font-bold text-center mb-12">作品展示</h2>
    <div class="grid md:grid-cols-3 gap-8 max-w-6xl mx-auto">
      <div class="rounded overflow-hidden shadow-lg">
        <img src="https://via.placeholder.com/400x300" alt="作品1" class="w-full">
        <div class="p-4">
          <h3 class="font-bold text-xl mb-2">作品1</h3>
          <p class="text-gray-700">简短描述你的作品亮点和特点。</p>
        </div>
      </div>
      <div class="rounded overflow-hidden shadow-lg">
        <img src="https://via.placeholder.com/400x300" alt="作品2" class="w-full">
        <div class="p-4">
          <h3 class="font-bold text-xl mb-2">作品2</h3>
          <p class="text-gray-700">简短描述你的作品亮点和特点。</p>
        </div>
      </div>
      <div class="rounded overflow-hidden shadow-lg">
        <img src="https://via.placeholder.com/400x300" alt="作品3" class="w-full">
        <div class="p-4">
          <h3 class="font-bold text-xl mb-2">作品3</h3>
          <p class="text-gray-700">简短描述你的作品亮点和特点。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 用户评价 -->
  <section id="testimonials" class="py-20 px-6 max-w-5xl mx-auto text-center">
    <h2 class="text-4xl font-bold mb-12">用户评价</h2>
    <div class="flex flex-col md:flex-row gap-8 justify-center">
      <div class="bg-gray-100 p-6 rounded-lg shadow-lg w-80">
        <p class="mb-4">“他的设计让我网站瞬间高级感十足，用户体验也很棒。”</p>
        <p class="font-bold">张先生，企业主</p>
      </div>
      <div class="bg-gray-100 p-6 rounded-lg shadow-lg w-80">
        <p class="mb-4">“专业、高效，非常值得合作。”</p>
        <p class="font-bold">李小姐，自由职业者</p>
      </div>
    </div>
  </section>

  <!-- 联系我 -->
  <section id="contact" class="py-20 px-6 bg-gradient-to-r from-indigo-600 to-blue-600 text-white text-center">
    <h2 class="text-4xl font-bold mb-6">准备好开始了吗？</h2>
    <p class="mb-8">填写下面表单，我会尽快联系你！</p>
    <form class="max-w-xl mx-auto flex flex-col gap-4">
      <input type="text" placeholder="姓名" class="p-3 rounded text-gray-800" required>
      <input type="email" placeholder="邮箱" class="p-3 rounded text-gray-800" required>
      <textarea placeholder="留言" class="p-3 rounded text-gray-800" rows="4" required></textarea>
      <button type="submit" class="bg-orange-500 hover:bg-orange-600 px-6 py-3 rounded-full font-semibold transition">发送消息</button>
    </form>
  </section>

  <!-- 底部 -->
  <footer class="py-6 text-center bg-gray-900 text-white">
    <p>© 2026 极致之站. 保留所有权利.</p>
  </footer>

</body>
</html>
