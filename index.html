<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高级AI工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 font-sans">

<!-- Hero -->
<section class="min-h-screen flex flex-col justify-center items-center text-center px-6 bg-gradient-to-r from-black to-gray-800 text-white">
  <h1 class="text-5xl md:text-6xl font-bold mb-6">立即获取高级 AI 工具</h1>
  <p class="text-xl md:text-2xl max-w-2xl mb-10 text-gray-300">
    自动生成内容、提升效率、简单易用。数百用户已在使用。
  </p>
  <a href="#pricing" class="bg-white text-black px-8 py-4 rounded-full font-bold text-lg hover:bg-gray-200">
    立即开始
  </a>
</section>

<!-- 功能区 -->
<section class="py-20 px-6 max-w-5xl mx-auto text-center">
  <h2 class="text-3xl font-bold mb-10">为什么选择我们</h2>
  <div class="grid md:grid-cols-3 gap-8">
    <div class="p-6 border rounded-lg">
      <h3 class="font-bold mb-2">🚀 快速</h3>
      <p class="text-gray-600">秒级生成内容，立即使用</p>
    </div>
    <div class="p-6 border rounded-lg">
      <h3 class="font-bold mb-2">🎯 精准</h3>
      <p class="text-gray-600">结果高质量，适合实际使用</p>
    </div>
    <div class="p-6 border rounded-lg">
      <h3 class="font-bold mb-2">💡 简单</h3>
      <p class="text-gray-600">无需学习，打开即用</p>
    </div>
  </div>
</section>

<!-- 用户信任区 -->
<section class="bg-gray-50 py-20 px-6 text-center">
  <h2 class="text-3xl font-bold mb-10">用户反馈</h2>
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-lg shadow">“非常好用，效率提升明显。” — 用户 A</div>
    <div class="bg-white p-6 rounded-lg shadow">“比我想象的简单很多。” — 用户 B</div>
  </div>
</section>

<!-- 价格/付费区 -->
<section id="pricing" class="py-24 px-6 text-center bg-black text-white">
  <h2 class="text-3xl font-bold mb-6">选择你的方案</h2>
  <p class="text-gray-300 mb-12">一次付费，立即使用全部功能</p>
  <div class="max-w-md mx-auto bg-white text-black rounded-lg p-8">
    <h3 class="text-2xl font-bold mb-4">高级版</h3>
    <p class="text-4xl font-bold mb-6">$9.99</p>
    <ul class="text-left space-y-2 mb-6">
      <li>✔ 无限使用</li>
      <li>✔ 优先体验新功能</li>
      <li>✔ 持续更新</li>
    </ul>
    <!-- Stripe/Gumroad/PayPal -->
    <a href="https://your-payment-link.com" class="block bg-black text-white py-3 rounded font-bold">
      立即购买
    </a>
  </div>
</section>

<!-- 底部 -->
<footer class="text-center py-6 text-gray-500 text-sm">© 2026 高级AI工具</footer>

</body>
</html>
